<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#12110f" />
  <meta name="application-name" content="FilmDen" />
  <meta name="apple-mobile-web-app-title" content="FilmDen" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="color-scheme" content="dark" />
  <title>FilmDen</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23e94b35'/%3E%3Crect x='38' y='54' width='104' height='72' rx='12' fill='%2312110f'/%3E%3Cpath d='M38 70h104M55 54l14 16M83 54l14 16M111 54l14 16' stroke='%23f6efdf' stroke-width='8'/%3E%3Ccircle cx='90' cy='98' r='14' fill='%23f6efdf'/%3E%3C/svg%3E" />
  <style>
    :root {
      --page:#12110f;
      --card:#1c1b18;
      --panel:#24221e;
      --panel-2:#2b2924;
      --text:#f6efdf;
      --muted:#a9a399;
      --line:rgba(246,239,223,.12);
      --accent:#e94b35;
      --accent-dark:#c93c2a;
      --gold:#f1b84b;
      --correct:#52b97b;
      --wrong:#e36a5a;
      --shadow:0 22px 70px rgba(0,0,0,.34);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;background:var(--page);color:var(--text)}
    body{
      min-height:100vh; min-height:100dvh; display:flex;
      font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));
      background:
        radial-gradient(circle at 12% 8%,rgba(233,75,53,.14),transparent 24rem),
        radial-gradient(circle at 88% 92%,rgba(241,184,75,.08),transparent 26rem),
        var(--page);
    }
    button,input,select{font:inherit}
    button{appearance:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    button:active{transform:translateY(1px)}
    .hidden{display:none!important}
    .shell{width:min(650px,100%);margin:auto;display:flex;flex-direction:column;min-height:0}
    .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px;padding:0 3px}
    .brand{display:flex;align-items:center;gap:9px;min-width:0}
    .brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);position:relative;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
    .brand-mark:before{content:"";position:absolute;left:7px;right:7px;top:9px;height:12px;border-radius:3px;background:var(--page)}
    .brand-mark:after{content:"";position:absolute;width:7px;height:7px;border-radius:50%;background:var(--text);left:12px;top:11px}
    .title{font-size:clamp(1.05rem,3.4vw,1.35rem);font-weight:900;letter-spacing:-.045em}
    .top-actions{display:flex;align-items:center;gap:8px;min-width:0}
    .progress-text{color:var(--muted);font-size:.84rem;font-variant-numeric:tabular-nums;white-space:nowrap}
    .home-btn{min-height:34px;padding:0 11px;border-radius:10px;background:rgba(246,239,223,.08);color:var(--text);font-size:.76rem;font-weight:800}
    .progress-track{height:6px;border-radius:999px;background:rgba(246,239,223,.09);overflow:hidden;margin-bottom:12px}
    .progress-fill{height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:inherit;transition:width .2s ease}
    .card{width:100%;min-height:530px;display:flex;flex-direction:column;overflow:hidden;background:linear-gradient(180deg,#1f1e1b,#191815);border:1px solid var(--line);border-radius:clamp(22px,4vw,30px);box-shadow:var(--shadow)}
    .game-header{min-height:70px;padding:12px 17px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px}
    .game-header-copy{min-width:0}
    .kicker{color:var(--gold);font-size:.69rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}
    .mode-name{margin-top:3px;font-size:1.08rem;font-weight:850;letter-spacing:-.025em}
    .score-pill{padding:7px 10px;border-radius:999px;background:rgba(246,239,223,.07);color:var(--muted);font-size:.76rem;font-weight:850;white-space:nowrap}
    .stage-area{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:clamp(22px,5vw,40px)}
    .stage{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px}
    .stage.people-stage{justify-content:flex-start}
    .stage-label{color:var(--muted);font-size:.72rem;font-weight:850;letter-spacing:.12em;text-transform:uppercase}
    .question{margin:0;max-width:560px;font-size:clamp(1.75rem,6.3vw,3.15rem);line-height:1.03;letter-spacing:-.05em;text-wrap:balance}
    .question.small{font-size:clamp(1.45rem,5.2vw,2.45rem)}
    .subcopy{max-width:48ch;color:var(--muted);font-size:.9rem;line-height:1.45;text-wrap:balance}
    .movie-pair{width:min(560px,100%);display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;gap:9px}
    .movie-chip{min-width:0;display:flex;align-items:center;justify-content:center;min-height:92px;padding:16px 13px;border:1px solid var(--line);border-radius:16px;background:rgba(246,239,223,.045);font-size:clamp(1.08rem,4vw,1.45rem);font-weight:850;line-height:1.14;letter-spacing:-.025em;text-wrap:balance}
    .plus{align-self:center;color:var(--muted);font-size:1.25rem;font-weight:900}
    .person-row{width:min(560px,100%);display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .person-card{padding:15px 12px;border-radius:16px;border:1px solid rgba(82,185,123,.25);background:rgba(82,185,123,.08)}
    .person-label{font-size:.64rem;color:var(--muted);font-weight:900;letter-spacing:.1em;text-transform:uppercase;margin-bottom:4px}
    .person-name{font-size:clamp(1.15rem,4.2vw,1.55rem);font-weight:900;letter-spacing:-.03em}
    .answer-panel{width:min(560px,100%);display:grid;gap:9px}
    .answer-input{width:100%;min-height:52px;padding:0 15px;border-radius:14px;border:1px solid var(--line);outline:none;background:rgba(246,239,223,.07);color:var(--text);font-size:1rem;font-weight:750;text-align:center}
    .answer-input::placeholder{color:#777269}
    .answer-input:focus{border-color:rgba(233,75,53,.65);box-shadow:0 0 0 3px rgba(233,75,53,.12)}
    .answer-actions{display:grid;grid-template-columns:1fr 1.6fr;gap:9px}
    .action{min-height:48px;border-radius:13px;padding:0 13px;font-weight:850}
    .secondary{background:rgba(246,239,223,.08);color:var(--text)}
    .primary{background:var(--accent);color:white}
    .primary:hover{background:var(--accent-dark)}
    .feedback{min-height:1.35em;font-size:.82rem;font-weight:750;color:var(--muted)}
    .feedback.correct{color:var(--correct)}
    .feedback.wrong{color:var(--wrong)}
    .feedback.near{color:var(--gold)}
    .spelling-fix{justify-self:center;min-height:36px;padding:0 12px;border-radius:10px;border:1px solid rgba(241,184,75,.28);background:rgba(241,184,75,.10);color:var(--gold);font-size:.72rem;font-weight:900}
    .spelling-fix:hover{background:rgba(241,184,75,.16)}
    .reveal-card{width:min(560px,100%);padding:18px;border-radius:18px;background:rgba(82,185,123,.09);border:1px solid rgba(82,185,123,.25)}
    .reveal-label{font-size:.65rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:var(--correct)}
    .reveal-answer{margin-top:5px;font-size:clamp(1.65rem,6vw,2.75rem);font-weight:950;letter-spacing:-.045em;line-height:1.03;text-wrap:balance}
    .reveal-detail{margin-top:9px;color:var(--muted);font-size:.84rem;line-height:1.45}
    .title-link-people{width:min(560px,100%);display:grid;gap:9px}
    .actor-chip{padding:16px;border-radius:16px;background:rgba(246,239,223,.05);border:1px solid var(--line);font-size:clamp(1.25rem,4.5vw,1.75rem);font-weight:900;letter-spacing:-.03em}
    .link-example{display:grid;gap:5px;margin-top:8px}
    .link-line{font-size:.86rem;color:var(--muted)}
    .link-line strong{color:var(--text)}
    .controls{display:grid;grid-template-columns:.9fr 1.55fr;gap:9px;margin-top:12px}
    .controls > .secondary.hidden + .primary{grid-column:1/-1}
    .controls button{min-height:52px;border-radius:14px;font-weight:850}
    .stage > .done{width:100%;min-height:420px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:38px 20px;gap:12px}
    .done-icon{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;background:rgba(241,184,75,.13);border:1px solid rgba(241,184,75,.28);font-size:1.5rem}
    .stage > .done h2{margin:0;font-size:clamp(2rem,7vw,3rem);letter-spacing:-.05em}
    .stage > .done p{margin:0;color:var(--muted);line-height:1.45;max-width:44ch}
    .summary-grid{width:min(500px,100%);display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
    .summary-card{padding:13px 8px;border-radius:14px;background:rgba(246,239,223,.05);border:1px solid var(--line)}
    .summary-value{font-size:1.5rem;font-weight:950;letter-spacing:-.04em}
    .summary-label{margin-top:4px;color:var(--muted);font-size:.62rem;font-weight:850;letter-spacing:.08em;text-transform:uppercase}
    .round-complete-hero{width:min(560px,100%);display:grid;justify-items:center;gap:7px;padding:22px 18px 20px;border-radius:20px;border:1px solid rgba(241,184,75,.28);background:linear-gradient(180deg,rgba(241,184,75,.09),rgba(246,239,223,.035));text-align:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.035)}
    .round-complete-icon{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:rgba(241,184,75,.14);border:1px solid rgba(241,184,75,.30);color:var(--gold);font-size:1.05rem;font-weight:950}
    .round-complete-kicker{color:var(--gold);font-size:.65rem;font-weight:950;letter-spacing:.13em;text-transform:uppercase}
    .round-complete-title{max-width:100%;font-size:clamp(1.65rem,6vw,2.65rem);font-weight:950;letter-spacing:-.045em;line-height:1.04;text-wrap:balance;overflow-wrap:anywhere}
    .round-complete-detail{max-width:46ch;color:var(--muted);font-size:.78rem;line-height:1.4;text-wrap:balance}
    .round-complete-score{margin-top:3px;padding:7px 10px;border-radius:999px;background:rgba(246,239,223,.07);border:1px solid rgba(246,239,223,.08);font-size:.72rem;font-weight:900;color:var(--text)}
    .overlay{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:max(12px,env(safe-area-inset-top)) 12px max(12px,env(safe-area-inset-bottom));background:rgba(10,9,8,.78);backdrop-filter:blur(12px)}
    .menu{width:min(560px,100%);max-height:calc(100dvh - 24px);overflow:auto;background:#1a1916;border:1px solid var(--line);border-radius:26px;box-shadow:0 30px 100px rgba(0,0,0,.55);padding:20px}
    .menu-brand{display:flex;align-items:center;gap:11px}
    .menu h1{margin:0;font-size:clamp(2rem,7vw,3rem);letter-spacing:-.06em}
    .menu-intro{margin:8px 0 18px;color:var(--muted);line-height:1.45;max-width:46ch}
    .section-label{margin:16px 0 8px;color:var(--muted);font-size:.66rem;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    .mode-grid{display:grid;gap:9px}
    .mode-card{width:100%;padding:14px 15px;border-radius:16px;border:1px solid var(--line);background:rgba(246,239,223,.045);color:var(--text);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:12px;text-align:left}
    .mode-card.active{border-color:rgba(233,75,53,.58);background:rgba(233,75,53,.10);box-shadow:inset 0 0 0 1px rgba(233,75,53,.18)}
    .mode-card.disabled{opacity:.46;cursor:default}
    .mode-card>span:first-child{display:block;min-width:0}
    .mode-title{display:block;font-size:1rem;font-weight:900}
    .mode-desc{display:block;margin-top:4px;color:var(--muted);font-size:.75rem;line-height:1.3}
    .mode-badge{padding:6px 8px;border-radius:999px;background:rgba(246,239,223,.07);color:var(--muted);font-size:.62rem;font-weight:900;text-transform:uppercase;letter-spacing:.08em}
    .session-options{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
    .length-btn{min-height:43px;border-radius:12px;background:rgba(246,239,223,.06);color:var(--text);font-weight:850;border:1px solid var(--line)}
    .length-btn.active{background:var(--gold);color:#17130d;border-color:transparent}
    .start-btn{width:100%;min-height:54px;margin-top:15px;border-radius:15px;background:var(--accent);color:white;font-size:1rem;font-weight:900}
    .tiny-note{text-align:center;margin-top:9px;color:#777269;font-size:.65rem;line-height:1.35}

    .cast-list{width:min(560px,100%);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
    .cast-list .person-card:last-child:nth-child(odd){grid-column:1/-1}
    .cast-count{color:var(--muted);font-size:.76rem;font-weight:800}
    .title-progress{width:min(560px,100%);display:grid;gap:7px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;background:rgba(246,239,223,.035)}
    .title-progress-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
    .title-progress-count{font-size:.76rem;font-weight:900;color:var(--text)}
    .title-progress-left{font-size:.69rem;font-weight:800;color:var(--muted);text-align:right}
    .title-progress-track{display:grid;grid-template-columns:repeat(var(--title-total,5),1fr);gap:5px}
    .title-progress-dot{height:5px;border-radius:999px;background:rgba(246,239,223,.09);transition:background .18s ease}
    .title-progress.safe .title-progress-dot.shown{background:var(--correct)}
    .title-progress.warn .title-progress-dot.shown{background:var(--gold)}
    .title-progress.danger .title-progress-dot.shown{background:var(--wrong)}
    .title-progress-note{font-size:.7rem;line-height:1.3;color:var(--muted);font-weight:750}
    .title-progress.safe{border-color:rgba(82,185,123,.23);background:rgba(82,185,123,.035)}
    .title-progress.safe .title-progress-left{color:var(--correct)}
    .title-progress.warn{border-color:rgba(241,184,75,.28);background:rgba(241,184,75,.055)}
    .title-progress.warn .title-progress-left,.title-progress.warn .title-progress-note{color:var(--gold);font-weight:850}
    .title-progress.danger{border-color:rgba(227,106,90,.32);background:rgba(227,106,90,.055)}
    .title-progress.danger .title-progress-left,.title-progress.danger .title-progress-note{color:#f08b7c;font-weight:850}
    .clue-budget{display:grid;gap:6px;width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:rgba(246,239,223,.025)}
    .clue-budget-head{display:flex;justify-content:space-between;gap:10px;color:var(--muted);font-size:.62rem;font-weight:850}
    .clue-budget-track{display:grid;grid-template-columns:repeat(var(--clue-total,5),1fr);gap:5px}
    .clue-budget-seg{height:5px;border-radius:999px;background:rgba(246,239,223,.09)}
    .clue-budget.safe .clue-budget-seg.available{background:var(--correct)}
    .clue-budget.warn .clue-budget-seg.available{background:var(--gold)}
    .clue-budget.danger .clue-budget-seg.available{background:var(--wrong)}
    .clue-budget.safe{border-color:rgba(82,185,123,.20)}
    .clue-budget.warn{border-color:rgba(241,184,75,.24)}
    .clue-budget.danger{border-color:rgba(227,106,90,.28)}
    .game-assist-actions{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap;width:100%}
    .game-assist-btn{min-height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:rgba(246,239,223,.045);color:var(--muted);font-size:.69rem;font-weight:900}
    .game-assist-btn.hint{border-color:rgba(241,184,75,.26);background:rgba(241,184,75,.065);color:var(--gold)}
    .game-assist-btn.give-up{border-color:rgba(227,106,90,.24);background:rgba(227,106,90,.045);color:#e49a90}
    .game-assist-btn:disabled{opacity:.35;cursor:not-allowed}
    .assist-hint-copy{padding:8px 10px;border-radius:10px;border:1px solid rgba(241,184,75,.18);background:rgba(241,184,75,.055);color:var(--gold);font-size:.7rem;font-weight:820;line-height:1.3;text-align:center}
    .game-premise{width:min(560px,100%);margin:-2px auto 2px;color:var(--muted);font-size:.76rem;line-height:1.38;text-align:center;text-wrap:balance}
    .box-selection-pending{padding:8px 10px;border-radius:10px;border:1px solid rgba(241,184,75,.28);background:rgba(241,184,75,.07);color:var(--gold);font-size:.72rem;font-weight:850;text-align:center}
    .ensemble-inline-tools{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-top:-2px}
    .ensemble-inline-status{color:var(--muted);font-size:.62rem;font-weight:820}
    .ensemble-inline-status.safe{color:var(--correct)}
    .ensemble-inline-status.warn{color:var(--gold)}
    .ensemble-inline-status.danger{color:var(--wrong)}
    .ensemble-inline-actions{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
    .ensemble-inline-actions .game-assist-btn{min-height:32px;padding:0 10px;font-size:.64rem}
    .ensemble-find-section .ensemble-clue-nav{margin-top:0}
    .ensemble-cast-section .ensemble-shared-cta{width:100%;margin-top:2px}
    .local-spelling-fix{margin-top:6px}
    .choice-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-top:8px}
    .choice-option{min-height:36px;padding:7px 8px;border-radius:10px;border:1px solid var(--line);background:rgba(246,239,223,.05);color:var(--text);font-size:.69rem;font-weight:800;line-height:1.16;text-align:center}
    .choice-option.selected{border-color:rgba(241,184,75,.46);background:rgba(241,184,75,.10);color:var(--gold)}
    .collab-card .clue-budget{margin-top:8px}
    .collab-card .game-assist-actions{margin-top:8px;justify-content:flex-start}
    .collab-choice-note{margin-top:7px;color:var(--muted);font-size:.62rem;line-height:1.25}
    .collab-answer-list{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}
    .collab-answer-pill{padding:5px 7px;border-radius:999px;border:1px solid rgba(82,185,123,.24);background:rgba(82,185,123,.07);color:var(--correct);font-size:.65rem;font-weight:850}
    .collab-film-stage{margin-top:10px;padding-top:10px;border-top:1px solid rgba(246,239,223,.09);display:grid;gap:8px}
    .collab-film-head{display:flex;align-items:end;justify-content:space-between;gap:10px}
    .collab-film-title{font-size:.75rem;font-weight:930;letter-spacing:-.01em}
    .collab-film-count{color:var(--muted);font-size:.62rem;font-weight:850;white-space:nowrap}
    .collab-film-found{display:flex;flex-wrap:wrap;gap:5px}
    .collab-film-pill{padding:5px 7px;border-radius:999px;border:1px solid rgba(82,185,123,.24);background:rgba(82,185,123,.07);color:var(--correct);font-size:.63rem;font-weight:820}
    .collab-film-pill.revealed{border-color:rgba(227,106,90,.20);background:rgba(227,106,90,.05);color:#d9a39b}
    .collab-film-input-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px}
    .collab-film-input{min-width:0;min-height:40px;border-radius:10px;border:1px solid var(--line);background:rgba(246,239,223,.06);color:var(--text);padding:0 10px;font-size:.76rem;font-weight:760}
    .collab-film-add{min-height:40px;padding:0 12px;border-radius:10px;background:rgba(233,75,53,.16);border:1px solid rgba(233,75,53,.30);color:var(--text);font-size:.7rem;font-weight:900}
    .collab-film-feedback{min-height:1.1em;color:var(--muted);font-size:.64rem;font-weight:760;line-height:1.25}
    .collab-film-feedback.correct{color:var(--correct)}
    .collab-film-feedback.wrong{color:var(--wrong)}
    .collab-film-feedback.near{color:var(--gold)}
    .collab-film-complete{padding:7px 9px;border-radius:9px;background:rgba(82,185,123,.065);color:var(--correct);font-size:.66rem;font-weight:850;text-align:center}
    .round-assist-bar{width:min(560px,100%);display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
    .ensemble-board{width:min(560px,100%);display:grid;gap:8px;padding:11px 12px;border:1px solid var(--line);border-radius:16px;background:rgba(246,239,223,.035);text-align:left}

      .match-drawer .game-assist-actions,

      .match-slot{min-height:44px;padding:5px 4px}
      .match-drawer{gap:4px;padding-top:5px}

    <section class="card" id="gameCard">

    <section class="menu">
      <div class="menu-brand"><span class="brand-mark" aria-hidden="true"></span><h1 id="startTitle">FilmDen</h1></div>
      <p class="menu-intro">Movie knowledge without the usual trivia questions. Find the people, links and films hiding between the clues.</p>

      <div class="daily-head"><div class="section-label">Today's games</div><div class="daily-date" id="dailyDate"></div></div>
      <div class="daily-grid" id="dailyGrid">
        <button class="daily-card" data-daily-mode="title" type="button"><span class="daily-copy"><span class="daily-title">Title Link</span><span class="daily-desc">Find the word shared across movie titles.</span></span><span class="daily-status">Daily</span></button>

        <button class="daily-card" data-daily-mode="career" type="button"><span class="daily-copy"><span class="daily-title">Career Résumé</span><span class="daily-desc">Match superlatives within one selected set of films.</span></span><span class="daily-status">Daily</span></button>

      <div class="tiny-note">One new daily challenge in each game. Finish today's puzzle to keep playing that game.</div>
    </section>

  function makeStathamRound(rng=Math.random){
    const statham = "Jason Statham";
    const available = STATHAM_TARGET_PEOPLE.filter(name=>connectionPeople().some(p=>norm(p)===norm(name)));

    // midpoint. Start and Finish may already share a film with each other — that
    // is a fun red herring because the route still has to pass through Statham.
    const disconnectedFromStatham = available.filter(name=>!sharedConnectionFilms(name,statham).length);
    const pool = disconnectedFromStatham.length >= 2 ? disconnectedFromStatham : available;
    let start=null,end=null;
    for(let attempt=0;attempt<240;attempt++){
      const a=pickOne(pool,rng), b=pickOne(pool,rng);
      if(!a||!b||norm(a)===norm(b)) continue;
      if(sharedConnectionFilms(a,statham).length) continue;
      if(sharedConnectionFilms(statham,b).length) continue;
      start=a; end=b; break;

    // Deterministic-safe fallback: only enforce the required midpoint rule.
    if(!start||!end){

        }

    }

  }

  function wikiMovieCandidatePages(title, year=""){

  async function wikiPageThumbExact(pageTitle, thumbSize=520){
    const url=`https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages%7Cpageprops&piprop=thumbnail&pithumbsize=${thumbSize}&titles=${encodeURIComponent(pageTitle)}`;
    const json=await fetchJson(url);
    const pages=Object.values(json?.query?.pages||{});
    const page=pages.find(p=>p && !p.missing);
    if(!page || page.pageprops?.disambiguation !== undefined) return "";

  function wikiPosterFileScore(fileTitle, filmTitle){
    const raw=String(fileTitle||"");
    const f=normalizeLooseLabel(raw.replace(/^File:/i,"").replace(/\.[a-z0-9]{2,5}$/i,""));
    const t=normalizeLooseLabel(filmTitle);
    if(!f || /logo|icon|symbol|flag|map|signature|wordmark|soundtrack|album|dvd|blu ray|bluray|video game/.test(f)) return -999;
    let score=0;
    if(/poster/.test(f)) score+=120;
    if(/theatrical/.test(f)) score+=80;
    if(/film poster|movie poster/.test(f)) score+=60;
    if(t && f.includes(t)) score+=35;
    if(/cover/.test(f)) score+=8;
    if(/\.svg$/i.test(raw)) score-=100;
    return score;
  }
  async function wikiFileThumb(fileTitle, thumbSize=520){
    const url=`https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&prop=imageinfo&iiprop=url&iiurlwidth=${thumbSize}&titles=${encodeURIComponent(fileTitle)}`;
    const json=await fetchJson(url);

  async function wikiMoviePosterExact(pageTitle, filmTitle, thumbSize=520){
    const url=`https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=images%7Cpageprops&imlimit=100&titles=${encodeURIComponent(pageTitle)}`;
    const json=await fetchJson(url);
    const pages=Object.values(json?.query?.pages||{});
    const page=pages.find(p=>p && !p.missing);
    if(!page || page.pageprops?.disambiguation !== undefined) return "";
    const candidates=(page.images||[])
      .map(item=>({title:item.title,score:wikiPosterFileScore(item.title,filmTitle)}))
      .filter(item=>item.score>0)
      .sort((a,b)=>b.score-a.score);
    for(const item of candidates.slice(0,4)){
      const image=await wikiFileThumb(item.title,thumbSize);
      if(image) return image;
    }
    return "";
  }
  async function fetchMovieMeta(title, year=""){
    const resolvedYear=resolvedMovieYear(title,year);
    const key=movieCacheKey(title,resolvedYear);
    const pendingKey=`movie:${key}`;
    if(mediaPending.has(pendingKey)) return mediaPending.get(pendingKey);
    const job=(async()=>{
      let image="",fallbackImage="",matchedPage="";
      for(const pageTitle of wikiMovieCandidatePages(title,resolvedYear)){
        image=await wikiMoviePosterExact(pageTitle,title,520);
        if(image){ matchedPage=pageTitle; break; }
        if(!fallbackImage){
          const generic=await wikiPageThumbExact(pageTitle,520);
          if(generic){ fallbackImage=generic; matchedPage=pageTitle; }
        }
      }
      const primary=image || fallbackImage;
      mediaCache.movies[key]=primary
        ? {title,year:resolvedYear,image:primary,fallbackImage:image&&fallbackImage&&image!==fallbackImage?fallbackImage:"",source:image?"wikipedia-poster":"wikipedia-pageimage",page:matchedPage,ts:Date.now()}
        : {missing:true,title,year:resolvedYear,source:"wikipedia",ts:Date.now()};
      saveMediaCacheSoon();
      return mediaCache.movies[key];
    })().finally(()=>mediaPending.delete(pendingKey));
    mediaPending.set(pendingKey,job);
    return job;
  }

  async function wikiThumbForPerson(name){
    const exactUrl = `https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages%7Cpageprops&piprop=thumbnail&pithumbsize=520&titles=${encodeURIComponent(name)}`;

    if(hit?.thumbnail?.source) return hit.thumbnail.source;

    const target = normalizeLooseLabel(name);
    const searchUrl = `https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=0&gsrlimit=8&gsrsearch=${encodeURIComponent(`"${name}" actor actress director producer writer comedian musician`)}&prop=pageimages%7Cpageprops&piprop=thumbnail&pithumbsize=520`;

  function preloadImage(url){
    const clean=String(url||"").trim();
    if(!clean) return Promise.resolve(false);
    if(mediaVerified.has(clean)) return Promise.resolve(true);
    if(mediaRejected.has(clean)) return Promise.resolve(false);
    return new Promise(resolve=>{
      const probe=new Image();
      let settled=false;
      const done=ok=>{
        if(settled) return;
        settled=true;
        if(ok) mediaVerified.add(clean); else mediaRejected.add(clean);
        resolve(ok);
      };
      probe.onload=()=>done(probe.naturalWidth>20 && probe.naturalHeight>20);
      probe.onerror=()=>done(false);
      probe.referrerPolicy="no-referrer";
      probe.src=clean;
    });
  }

  function enableHorizontalGrabScroll(rail){
    if(!rail||rail.dataset.grabScrollReady==="1")return;
    rail.dataset.grabScrollReady="1";
    let pointerId=null,startX=0,startScroll=0,moved=false,suppressClick=false;

    rail.addEventListener("wheel",event=>{
      if(rail.scrollWidth<=rail.clientWidth+1)return;
      const delta=Math.abs(event.deltaX)>Math.abs(event.deltaY)?event.deltaX:event.deltaY;
      if(!delta)return;
      const before=rail.scrollLeft;
      rail.scrollLeft+=delta;
      if(rail.scrollLeft!==before)event.preventDefault();
    },{passive:false});

    rail.addEventListener("pointerdown",event=>{
      if(event.pointerType!=="mouse"||event.button!==0)return;
      pointerId=event.pointerId;
      startX=event.clientX;
      startScroll=rail.scrollLeft;
      moved=false;
      suppressClick=false;
    });

    rail.addEventListener("pointermove",event=>{
      if(pointerId!==event.pointerId)return;
      const dx=event.clientX-startX;
      if(!moved&&Math.abs(dx)<8)return;
      if(!moved){
        moved=true;
        suppressClick=true;
        rail.classList.add("drag-scrolling");
        try{rail.setPointerCapture?.(pointerId)}catch(_){}
      }
      rail.scrollLeft=startScroll-dx;
      event.preventDefault();
    });

    const endGrab=event=>{
      if(pointerId===null||event.pointerId!==pointerId)return;
      if(moved){try{rail.releasePointerCapture?.(pointerId)}catch(_){}}
      pointerId=null;
      rail.classList.remove("drag-scrolling");
      moved=false;
      if(suppressClick)setTimeout(()=>{suppressClick=false;},40);
    };
    rail.addEventListener("pointerup",endGrab);
    rail.addEventListener("pointercancel",endGrab);
    rail.addEventListener("click",event=>{
      if(!suppressClick)return;
      event.preventDefault();
      event.stopPropagation();
    },true);
  }

  function makeBoxOfficeRound(rng=Math.random){

    const ranks=Object.keys(BOX_OFFICE_HINTS[year]||{}).map(Number).filter(rank=>rank<=50);
    const targetRank=pickOne(ranks,rng);

  function peopleDataValidOwners(set,fieldId,itemOwner,itemValue){
    const people=set.people||[],valid=new Set([Number(itemOwner)]);
    people.forEach((person,index)=>{if(norm(person?.[fieldId])===norm(itemValue))valid.add(index);});
    const extra=set.validFor?.[fieldId]?.[itemValue]||[];
    for(const name of extra){const index=people.findIndex(person=>norm(person.name)===norm(name));if(index>=0)valid.add(index);}
    return valid;
  }
  // Count distinct visible solutions for one People Match category. Two cards with
  // the same displayed value are intentionally interchangeable, so swapping their
  // hidden owner IDs does not count as a second solution.
  function peopleFieldSolutionCountForData(set,fieldId,limit=2){
    const people=set.people||[],items=people.map((person,owner)=>({owner,value:person[fieldId]}));
    const signatures=new Set(),assignment=new Array(people.length);
    const search=(personIndex,used)=>{
      if(signatures.size>=limit)return;
      if(personIndex>=people.length){
        signatures.add(assignment.map(owner=>norm(people[owner]?.[fieldId])).join("\u001f"));
        return;
      }
      for(const item of items){
        if(used.has(item.owner)||!peopleDataValidOwners(set,fieldId,item.owner,item.value).has(personIndex))continue;
        assignment[personIndex]=item.owner;
        used.add(item.owner);search(personIndex+1,used);used.delete(item.owner);
        if(signatures.size>=limit)return;
      }
    };
    search(0,new Set());
    return signatures.size;
  }
  function validatePeopleBoardData(set,limit=2){
    const fieldCounts={};
    let boardSolutions=1;
    for(const field of PEOPLE_MATCH_FIELDS){
      const count=peopleFieldSolutionCountForData(set,field.id,limit);
      fieldCounts[field.id]=count;
      if(count===0)return {ok:false,solutionCount:0,fieldCounts,reason:`${field.label} has no complete solution`};
      boardSolutions=Math.min(limit,boardSolutions*count);
      if(boardSolutions>=limit)return {ok:false,solutionCount:limit,fieldCounts,reason:"multiple distinct full-board solutions"};
    }
    return {ok:boardSolutions===1,solutionCount:boardSolutions,fieldCounts,reason:boardSolutions===1?"unique":"invalid"};

  function currentPeopleField(round,st){return round.data.fields[st.activeFieldIndex]||round.data.fields[0];}

  function peopleCanExtendField(round,st,fieldId,candidatePerson,candidateOwner){

    for(const key of st.locked||[]){
      const [lockedField,personText]=key.split(":");
      if(lockedField!==fieldId)continue;
      const owner=Number(st.assignments[key]);
      if(Number.isFinite(owner)) fixed.set(Number(personText),owner);

    if(candidatePerson!==undefined&&candidateOwner!==undefined) fixed.set(Number(candidatePerson),Number(candidateOwner));

      const personIndex=remainingPeople[position];

  function peopleFieldComplete(round,st,fieldId){return round.data.people.every((_,personIndex)=>st.locked.includes(peopleSlotKey(fieldId,personIndex)));}

  function editDistance(a,b){
    const left=norm(a),right=norm(b);
    if(!left||!right) return Number.MAX_SAFE_INTEGER;
    if(left===right) return 0;
    const prev=Array.from({length:right.length+1},(_,i)=>i),curr=new Array(right.length+1);
    for(let i=1;i<=left.length;i++){
      curr[0]=i;
      for(let j=1;j<=right.length;j++){
        const cost=left[i-1]===right[j-1]?0:1;
        curr[j]=Math.min(curr[j-1]+1,prev[j]+1,prev[j-1]+cost);
      }
      for(let j=0;j<=right.length;j++) prev[j]=curr[j];
    }
    return prev[right.length];
  }
  function typoCandidate(typed,candidates,canonical){
    const actual=norm(typed);
    if(actual.length<4) return null;
    const matches=[];
    for(const candidateRaw of candidates||[]){
      const candidate=norm(candidateRaw);
      if(candidate.length<4||candidate===actual) continue;
      const distance=editDistance(actual,candidate);
      const longest=Math.max(actual.length,candidate.length);
      const allowance=longest>=10?2:1;
      if(distance>0&&distance<=allowance) matches.push({candidateRaw,distance,gap:Math.abs(actual.length-candidate.length)});
    }
    matches.sort((a,b)=>a.distance-b.distance||a.gap-b.gap||String(a.candidateRaw).localeCompare(String(b.candidateRaw)));
    const best=matches[0];
    if(!best) return null;
    const rival=matches.find(item=>item!==best&&item.distance===best.distance&&item.gap===best.gap&&norm(item.candidateRaw)!==norm(best.candidateRaw));
    return rival?null:(canonical||best.candidateRaw);
  }
  function filmTitleTypoCandidate(typed,titles){
    const actual=filmTitleNorm(typed);
    if(actual.length<4)return null;
    const matches=[];
    for(const title of titles||[]){
      const candidate=filmTitleNorm(title);
      if(candidate.length<4||candidate===actual)continue;
      const distance=editDistance(actual,candidate);
      const longest=Math.max(actual.length,candidate.length);
      const allowance=longest>=10?2:1;
      if(distance>0&&distance<=allowance)matches.push({title,distance,gap:Math.abs(actual.length-candidate.length)});
    }
    matches.sort((a,b)=>a.distance-b.distance||a.gap-b.gap||a.title.localeCompare(b.title));
    const best=matches[0];if(!best)return null;
    const rival=matches.find(item=>item!==best&&item.distance===best.distance&&item.gap===best.gap&&filmTitleNorm(item.title)!==filmTitleNorm(best.title));
    return rival?null:best.title;
  }

  function collabValidAnswers(item){

  function collabCanonicalAnswer(item,value){

      if(norm(alias)!==typed)continue;
      const exactBySurname=collabValidAnswers(item).find(answer=>norm(answer).endsWith(` ${typed}`)||norm(answer)===typed);
      return exactBySurname||collabValidAnswers(item)[0]||null;
    }

  }

  function collabFilmsFor(item,answer=""){
    const selected=answer||collabValidAnswers(item)[0]||"";

      const key=Object.keys(item.filmsByAnswer).find(name=>norm(name)===norm(selected));
      if(key)return [...new Set((item.filmsByAnswer[key]||[]).filter(Boolean))];
    }
    return [...new Set((item.films||[]).filter(Boolean))];
  }
  function collabFilmCount(item){
    const counts=collabValidAnswers(item).map(answer=>collabFilmsFor(item,answer).length);
    return counts.length?Math.max(...counts):0;
  }
  function collabItemMax(item){return 1+collabFilmCount(item);}
  function collabOptionPool(item){
    const answers=collabValidAnswers(item);
    const base=[...answers,...(item.options||[]),...(COLLABORATOR_OPTION_POOL[item.kind]||[])];
    return [...new Map(base.filter(Boolean).map(name=>[norm(name),name])).values()];
  }
  function collabChoices(round,item,index,level){
    if(level<=0)return [];
    const wanted=level===1?10:level===2?6:3;
    const answers=collabValidAnswers(item);
    const subject=norm(round?.data?.person||"");
    // The person the round is about can never be their own collaborator.
    // Keep valid answers intact, but exclude the subject from every distractor pool.
    const pool=collabOptionPool(item).filter(name=>
      norm(name)!==subject && !answers.some(answer=>norm(answer)===norm(name))
    );
    const rng=seededRng(`${round.data.person}|${item.kind}|${index}|${level}|filmden-collab-hints`);
    const distractors=shuffle(pool,rng).slice(0,Math.max(0,wanted-answers.length));
    return shuffle([...answers,...distractors],seededRng(`${round.data.person}|${item.kind}|${index}|${level}|filmden-collab-order`));
  }
  function collabFilmVariants(title){ return filmTitleVariants(title); }

  function collabFoundFilms(st,index){return [...new Set(st.filmFound?.[index]||[])];}

  function collabHintedFilms(st,index){return [...new Set(st.filmHinted?.[index]||[])];}

  function collabPotentialScore(round,st){

    round.data.items.forEach((item,i)=>{

  function addCollaboratorFilm(round,index){

  // --- Smart connection network -------------------------------------------------
  // CONNECTION_FILMS is the instant/offline seed. Missing pairings are checked
  // against Wikidata on demand, cached locally, and then become part of the live
  // graph. A missing hand-authored edge is therefore not treated as proof that

  const CONNECTION_NETWORK_CACHE_KEY = "filmden-connection-network-v1";
  function loadConnectionNetworkCache(){
    try{
      const raw=JSON.parse(localStorage.getItem(CONNECTION_NETWORK_CACHE_KEY))||{};

  }
  let connectionNetworkCache=loadConnectionNetworkCache();
  let connectionNetworkSaveTimer=null;

    },180);
  }
  function connectionPairKey(a,b){return [norm(a),norm(b)].sort().join("||");}
  function cachedConnectionFilms(a,b){return connectionNetworkCache.pairs[connectionPairKey(a,b)]?.films||[];}
  function connectionPairChecked(a,b){return connectionNetworkCache.pairs[connectionPairKey(a,b)]?.checked===true;}
  function registerDynamicPerson(name,id="",description=""){
    const label=String(name||"").trim(); if(!label)return;
    const key=norm(label),prior=connectionNetworkCache.people[key]||{};

    saveConnectionNetworkSoon();
  }
  function addDiscoveredConnectionFilms(a,b,films){
    const clean=[...new Set((films||[]).map(v=>String(v||"").trim()).filter(Boolean))];
    const key=connectionPairKey(a,b),prior=connectionNetworkCache.pairs[key]?.films||[];
    connectionNetworkCache.pairs[key]={films:[...new Set([...prior,...clean])],checked:true,checkedAt:Date.now()};
    registerDynamicPerson(a);registerDynamicPerson(b);saveConnectionNetworkSoon();
    return connectionNetworkCache.pairs[key].films;

  async function wikidataJson(url){
    const response=await fetch(url,{mode:"cors",headers:{Accept:"application/json"}});
    if(!response.ok)throw new Error(`Wikidata request failed (${response.status})`);
    return response.json();
  }
  async function resolveWikidataPerson(name){
    const clean=String(name||"").trim();if(!clean)return null;

    if(connectionPersonFetches.has(key))return connectionPersonFetches.get(key);
    const job=(async()=>{
      const params=new URLSearchParams({action:"wbsearchentities",search:clean,language:"en",uselang:"en",type:"item",limit:"8",format:"json",origin:"*"});
      const data=await wikidataJson(`https://www.wikidata.org/w/api.php?${params}`);
      const results=Array.isArray(data?.search)?data.search:[];
      const filmPerson=/actor|actress|film director|director|filmmaker|screenwriter|writer|composer|producer|cinematographer|performer|comedian/i;
      const exact=results.find(item=>norm(item.label)===key&&filmPerson.test(item.description||""));
      const preferred=exact||results.find(item=>filmPerson.test(item.description||""))||results[0];
      if(!preferred?.id)return null;
      const person={id:preferred.id,label:preferred.label||clean,description:preferred.description||"",checkedAt:Date.now()};
      connectionNetworkCache.people[key]=person;connectionNetworkCache.people[norm(person.label)]=person;saveConnectionNetworkSoon();

  async function discoverSharedConnectionFilms(a,b){
    if(!a||!b)return {films:[],ok:false};

    if(connectionPairChecked(a,b))return {films:cachedConnectionFilms(a,b),ok:true,cached:true};
    if(connectionPairFetches.has(key))return connectionPairFetches.get(key);
    const job=(async()=>{
      const [pa,pb]=await Promise.all([resolveWikidataPerson(a),resolveWikidataPerson(b)]);
      if(!pa?.id||!pb?.id)return {films:[],ok:false,reason:"person"};
      const query=`SELECT DISTINCT ?film ?filmLabel WHERE {
        VALUES ?roleA { wdt:P161 wdt:P57 wdt:P58 wdt:P86 wdt:P162 }
        VALUES ?roleB { wdt:P161 wdt:P57 wdt:P58 wdt:P86 wdt:P162 }
        ?film ?roleA wd:${pa.id} .
        ?film ?roleB wd:${pb.id} .
        ?film wdt:P31/wdt:P279* wd:Q11424 .

  function connectionPeople(){

  function canonicalConnectionPerson(raw){
    const typed=norm(raw); if(!typed)return null;

    if(exact)return exact;

  function stathamEdgeFilms(a,b){ return sharedConnectionFilms(a,b); }

    return `<div class="statham-node ${stathamNodeConnectionClass(st,index)} ${fixed?'fixed':''} ${!fixed?'inserted':''} ${isStatham?'midpoint':''} ${isFinish?'finish':''}"><span class="statham-milestone-label">${label}</span>${escapeHtml(person)}${remove}</div>`;
  }
  function renderStathamConnector(st,d,index,allPeople){

    if(connected){

    }
    const selected=st.selectedGap===index;

    const spelling=selected&&st.spellingSuggestion?.gapIndex===index?st.spellingSuggestion.value:"";
    const spellingFix=spelling?`<button class="spelling-fix local-spelling-fix" id="stathamSpellingFixBtn" type="button">Fix my spelling</button>`:"";
    const entry=selected?`<div class="statham-gap-entry"><input id="stathamGapInput" list="stathamPeopleList" autocomplete="off" autocapitalize="words" placeholder="Add someone between ${escapeAttr(left)} and ${escapeAttr(right)}"/><button id="stathamGapAddBtn" type="button">Add</button>${localFeedback}${spellingFix}<div class="statham-gap-entry-actions"><button class="statham-gap-hint" type="button" data-statham-hint="${index}">Give me a movie hint</button></div></div>`:`<button class="statham-gap-plus" type="button" data-statham-gap="${index}" aria-label="Add a person between ${escapeAttr(left)} and ${escapeAttr(right)}">+</button>`;

  async function stathamInsertIntoGap(round,gapIndex,raw){
    const st=session.current,d=round.data;
    if(gapIndex<0||gapIndex>=st.nodes.length-1||st.lookupBusy)return;
    const typed=String(raw||"").trim();
    if(!typed){st.selectedGap=gapIndex;st.feedback="Type a person first.";st.feedbackType="near";renderStathamSix(round);return;}
    const local=canonicalConnectionPerson(typed);
    const spelling=!local?typoCandidate(typed,connectionPeople()):null;
    if(spelling){st.selectedGap=gapIndex;st.spellingSuggestion={gapIndex,value:spelling};st.feedback="Almost — that looks like a spelling slip.";st.feedbackType="near";renderStathamSix(round);return;}
    st.lookupBusy=true;st.selectedGap=gapIndex;st.spellingSuggestion=null;st.feedback="Checking film credits…";st.feedbackType="near";renderStathamSix(round);
    const next=local||await resolveConnectionPerson(typed);

      const spelling=typoCandidate(typed,connectionPeople());
      if(spelling){st.spellingSuggestion={gapIndex,value:spelling};st.feedback="Almost — that looks like a spelling slip.";st.feedbackType="near";}
      else{st.spellingSuggestion=null;st.feedback="I couldn't identify that film person. Try their full name.";st.feedbackType="wrong";}

    if(st.nodes.some(name=>norm(name)===norm(next))){st.lookupBusy=false;st.selectedGap=gapIndex;st.feedback=`${next} is already in this route.`;st.feedbackType="near";renderStathamSix(round);return;}
    const left=st.nodes[gapIndex],right=st.nodes[gapIndex+1];

    st.lookupBusy=false;
    const leftFilms=leftResult.films,rightFilms=rightResult.films;
    if(!leftFilms.length&&!rightFilms.length){
      st.selectedGap=gapIndex;
      if(!leftResult.ok||!rightResult.ok){st.feedback=`I couldn't verify ${next}'s film connections online just now. Try again rather than treating that as a definite no.`;st.feedbackType="near";}
      else{st.feedback=`I couldn't find a shared film connecting ${next} to either side of this gap.`;st.feedbackType="wrong";}

  function removeStathamNode(round,index){

    if(norm(person)===norm("Jason Statham")||norm(person)===norm(d.start)||norm(person)===norm(d.end))return;
    st.nodes.splice(index,1);
    const insertionIndex=st.insertions.findIndex(name=>norm(name)===norm(person));
    if(insertionIndex>=0)st.insertions.splice(insertionIndex,1);

  function stathamHintCandidates(st,gapIndex){

    for(const person of connectionPeople()){

      const leftFilms=stathamEdgeFilms(left,person);
      const rightFilms=stathamEdgeFilms(person,right);
      if(!leftFilms.length&&!rightFilms.length)continue;
      candidates.push({person,leftFilms,rightFilms,both:leftFilms.length&&rightFilms.length});
    }
    return candidates.sort((a,b)=>Number(b.both)-Number(a.both)-(b.leftFilms.length+b.rightFilms.length-a.leftFilms.length-a.rightFilms.length)||a.person.localeCompare(b.person));
  }
  function giveStathamMovieHint(round,gapIndex){
    const st=session.current;
    const candidates=stathamHintCandidates(st,gapIndex);
    if(!candidates.length){
      st.selectedGap=gapIndex;
      st.feedback="No useful movie hint is available for that gap in the current network.";
      st.feedbackType="near";
      renderStathamSix(round);
      return;
    }
    const historyKey=`${norm(st.nodes[gapIndex])}|${norm(st.nodes[gapIndex+1])}`;
    const usedHints=new Set((st.hintHistory||[]).filter(item=>item.key===historyKey).map(item=>item.film));
    let pick=null,side="";
    for(const candidate of candidates){
      const options=[...candidate.leftFilms.map(film=>({film,side:"left"})),...candidate.rightFilms.map(film=>({film,side:"right"}))];
      const fresh=options.find(option=>!usedHints.has(option.film));
      if(fresh){pick={...candidate,...fresh};side=fresh.side;break;}
    }
    if(!pick){
      const candidate=candidates[0];
      const film=candidate.leftFilms[0]||candidate.rightFilms[0];
      pick={...candidate,film,side:candidate.leftFilms.length?"left":"right"};
    }
    st.hintsUsed=(st.hintsUsed||0)+1;
    if(!Array.isArray(st.hintHistory))st.hintHistory=[];
    st.hintHistory.push({key:historyKey,film:pick.film});
    const anchor=side==="left"?st.nodes[gapIndex]:st.nodes[gapIndex+1];
    st.selectedGap=gapIndex;
    st.feedback=`Movie hint: ${pick.film} connects to ${anchor}. Think of someone from that film who could help bridge this gap.`;
    st.feedbackType="near";
    renderStathamSix(round);
  }
  function hydrateStathamVisibleEdges(round){
    const st=session.current;if(!st||st.done)return;
    const snapshot=st.nodes.join("||"),checks=[];
    for(let i=0;i<st.nodes.length-1;i++){
      const a=st.nodes[i],b=st.nodes[i+1];
      if(connectionPairChecked(a,b)||connectionPairFetches.has(connectionPairKey(a,b)))continue;
      checks.push(discoverSharedConnectionFilms(a,b));
    }
    if(!checks.length)return;
    Promise.allSettled(checks).then(()=>{
      if(!session||session.current!==st||st.nodes.join("||")!==snapshot)return;
      // The two required midpoint gaps must start genuinely open. The seed graph
      // filters obvious direct Statham collaborators synchronously; this live
      // check catches any extra direct credit discovered from Wikidata and quietly
      // rerolls before the player has added anyone.
      if(st.insertions.length===0&&st.nodes.length===3&&(stathamEdgeConnected(st.nodes[0],st.nodes[1])||stathamEdgeConnected(st.nodes[1],st.nodes[2]))){
        st.liveRerolls=(st.liveRerolls||0)+1;
        if(st.liveRerolls<=18){
          const rng=seededRng(`${todayKey()}|statham-live-reroll|${st.liveRerolls}|${round.data.start}|${round.data.end}`);
          const next=makeStathamRound(rng);
          round.data=next;
          st.nodes=[next.start,"Jason Statham",next.end];
          st.insertions=[];st.selectedGap=null;st.feedback="";st.feedbackType="";st.lookupBusy=false;
          renderStathamSix(round);return;
        }
      }
      if(stathamAllConnected(st)){st.done=true;const added=st.insertions.length;st.points=Math.max(1,stathamAvailableScore(st));completeCurrentRound(st.points,true);}
      renderStathamSix(round);
    });
  }
  function stathamAvailableScore(st){
    const extraPeople=Math.max(0,(st.insertions?.length||0)-2);
    return Math.max(0,6-extraPeople-(st.hintsUsed||0)-(st.giveUpsUsed||0)*2);
  }
  function seededConnectionAdjacency(){
    const map=new Map();
    const add=(a,b)=>{if(!map.has(a))map.set(a,new Set());map.get(a).add(b);};
    for(const item of CONNECTION_FILMS){
      const people=[...new Set(item.people||[])];
      for(let i=0;i<people.length;i++)for(let j=i+1;j<people.length;j++){add(people[i],people[j]);add(people[j],people[i]);}
    }
    return map;
  }
  function seededConnectionPath(startName,endName){
    const people=connectionPeople();
    const canonical=name=>people.find(p=>norm(p)===norm(name))||name;
    const start=canonical(startName),end=canonical(endName);if(norm(start)===norm(end))return [start];
    const graph=seededConnectionAdjacency(),queue=[start],prev=new Map([[start,null]]);
    while(queue.length){
      const cur=queue.shift();
      for(const next of graph.get(cur)||[]){if(prev.has(next))continue;prev.set(next,cur);if(norm(next)===norm(end)){const path=[next];let p=cur;while(p){path.push(p);p=prev.get(p);}return path.reverse();}queue.push(next);}
    }
    return null;
  }
  function giveUpStatham(round){
    const st=session.current,d=round.data;if(round.type!=="statham"||st.done)return;
    const left=seededConnectionPath(d.start,"Jason Statham"),right=seededConnectionPath("Jason Statham",d.end);
    if(!left||!right){st.feedback="I couldn't build a reliable reveal route from the seeded network.";st.feedbackType="near";renderStathamSix(round);return;}
    st.nodes=[...left,...right.slice(1)];
    st.insertions=st.nodes.filter((name,i)=>i>0&&i<st.nodes.length-1&&norm(name)!==norm("Jason Statham"));
    st.giveUpsUsed=(st.giveUpsUsed||0)+1;session.revealed+=1;st.points=0;st.done=true;completeCurrentRound(0,false);renderStathamSix(round);
  }
  function renderStathamSix(round){
    const st=session.current,d=round.data;
    const connectedEdges=st.nodes.slice(0,-1).filter((name,i)=>stathamEdgeConnected(name,st.nodes[i+1])).length;
    const totalEdges=Math.max(1,st.nodes.length-1);
    if(st.done){
      const stathamDetail=`Via Jason Statham · ${st.insertions.length+2} degrees${st.hintsUsed?` · ${st.hintsUsed} movie hint${st.hintsUsed===1?"":"s"} used`:""}`;
      stage.innerHTML=`<div class="stage-label">SIX DEGREES THROUGH JASON STATHAM COMPLETE</div>${roundCompleteHero(`${d.start} → ${d.end}`,stathamDetail,st.points,6)}<div class="statham-chain">${st.nodes.map((_,i)=>`${stathamNodeMarkup(st,d,i)}${i<st.nodes.length-1?renderStathamConnector(st,d,i,[]):''}`).join("")}</div>`;
      activateRoundCompleteUI();return;
    }
    const allPeople=connectionPeople();
    const pieces=[];
    for(let i=0;i<st.nodes.length;i++){
      pieces.push(stathamNodeMarkup(st,d,i));
      if(i<st.nodes.length-1)pieces.push(renderStathamConnector(st,d,i,allPeople));
    }
    stage.innerHTML=`<div class="stage-label">SIX DEGREES THROUGH JASON STATHAM</div>${gamePremiseMarkup("statham")}<div class="statham-wrap"><div class="statham-status"><span>${connectedEdges} of ${totalEdges} links connected</span><span>${st.insertions.length} added${st.hintsUsed?` · ${st.hintsUsed} hint${st.hintsUsed===1?"":"s"}`:""}</span></div><div class="statham-chain">${pieces.join("")}</div><div class="game-assist-actions"><button class="game-assist-btn give-up" id="stathamGiveUpBtn" type="button">Give up · reveal a route</button></div><datalist id="stathamPeopleList">${allPeople.filter(name=>!st.nodes.some(existing=>norm(existing)===norm(name))).map(name=>`<option value="${escapeAttr(name)}"></option>`).join("")}</datalist></div>`;
    stage.querySelectorAll('[data-statham-gap]').forEach(btn=>btn.addEventListener('click',()=>{st.selectedGap=Number(btn.dataset.stathamGap);st.spellingSuggestion=null;st.feedback="";st.feedbackType="";renderStathamSix(round);}));
    stage.querySelectorAll('[data-statham-remove]').forEach(btn=>btn.addEventListener('click',event=>{event.stopPropagation();removeStathamNode(round,Number(btn.dataset.stathamRemove));}));
    stage.querySelectorAll('[data-statham-hint]').forEach(btn=>btn.addEventListener('click',()=>giveStathamMovieHint(round,Number(btn.dataset.stathamHint))));
    $("stathamGiveUpBtn")?.addEventListener("click",()=>giveUpStatham(round));
    const input=$("stathamGapInput"),addBtn=$("stathamGapAddBtn");
    if(input&&st.selectedGap!==null){
      const add=()=>stathamInsertIntoGap(round,st.selectedGap,input.value);
      addBtn?.addEventListener('click',add);
      input.addEventListener('input',()=>{if(st.spellingSuggestion){st.spellingSuggestion=null;const btn=$("stathamSpellingFixBtn");btn?.classList.add("hidden");}});
      input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add();}});
      $("stathamSpellingFixBtn")?.addEventListener("click",()=>{const suggestion=st.spellingSuggestion?.value;if(!suggestion)return;input.value=suggestion;st.spellingSuggestion=null;stathamInsertIntoGap(round,st.selectedGap,suggestion);});
      if(st.lookupBusy){input.disabled=true;if(addBtn){addBtn.disabled=true;addBtn.textContent="Checking…";}}
      else requestAnimationFrame(()=>input.focus({preventScroll:true}));
    }
    bottom.classList.add("hidden");
    hydrateStathamVisibleEdges(round);
  }


  function currentInput(){return $("answerInput")?.value||"";}
  function feedback(text,type=""){const el=$("feedback");if(!el)return;el.textContent=text;el.className=`feedback ${type}`;}
  function submitAnswer(){
    const round=session.rounds[session.index],st=session.current;
    clearSpellingFix();
    if(round.type==="boxoffice"){
      const d=round.data,available=boxOfficeAvailableMovies(round,st);let selected=Number(st.selectedRank||0);
      const raw=String($("boxOfficeSearch")?.value||"").trim();
      if(!selected&&raw){
        const exact=available.find(item=>filmTitleMatches(raw,item.movie));
        if(exact)selected=exact.rank;
        else{
          const suggestion=filmTitleTypoCandidate(raw,available.map(item=>item.movie));
          const spellBtn=$("boxSpellingFixBtn");
          if(suggestion&&spellBtn){
            const item=available.find(candidate=>filmTitleNorm(candidate.movie)===filmTitleNorm(suggestion));
            feedback("Almost — that looks like a spelling slip.","near");
            spellBtn.classList.remove("hidden");
            spellBtn.onclick=()=>{
              if(!item)return;
              const input=$("boxOfficeSearch"),pending=$("boxSelectionPending");
              if(input){input.value=item.movie;input.classList.add("hidden");}
              st.selectedRank=item.rank;
              if(pending){pending.classList.add("hidden");pending.textContent="";}
              spellBtn.classList.add("hidden");
              const results=$("boxOfficeResults");
              if(results){
                results.classList.add("selection-mode");
                results.innerHTML=`<div class="movie-search-selected"><div class="box-selected-row"><div class="box-selected-copy"><div class="box-selected-label">Selected film</div>${movieMarkup(item.movie,{size:"tiny",year:d.year})}</div><div class="box-selected-actions"><button class="box-selected-change" type="button" data-box-change>Change</button><button class="box-selected-submit" type="button" data-box-submit>Submit guess</button></div></div></div>`;
                hydrateMedia(results);
              }
              bottom.classList.add("hidden");
            };
            return;
          }
        }
      }
      if(!selected){feedback("Select a movie first, then press Submit guess.","near");return;}
      st.focusRank=selected;
      if(selected===Number(d.targetRank)){
        st.points=Math.max(1,5-st.wrong-(st.manualHints||0));
        st.done=true;st.revealed=false;st.feedback="";st.feedbackType="";
        st.guessedRanks=[...new Set([...(st.guessedRanks||[]),selected])];
        completeCurrentRound(st.points,true);
        stage.scrollTop=0;
        renderRound();
        requestAnimationFrame(()=>{stage.scrollTop=0;});
        return;
      }
      if(!st.guessedRanks.includes(selected))st.guessedRanks.push(selected);
      st.wrong+=1;st.hintLevel=Math.min(hintsLength(round),(st.hintLevel||0)+1);const hintNo=st.hintLevel;
      st.feedback=`No — ${d.movies[selected-1]} was #${selected}. It's on the board now.${hintNo?` Hint ${hintNo} unlocked.`:""}`;st.feedbackType="wrong";renderRound();return;
    }
    const input=currentInput();if(!norm(input)){feedback("Type an answer first.","wrong");return;}
    if(round.type==="ensemble"){
      const d=round.data;
      if(st.phase==="cast"){
        const clue=d.cast[st.clueIndex];
        if(sameAnswer(input,personAnswers(clue.person))){
          feedback(`Correct — ${clue.person}.`,`correct`);
          setTimeout(()=>ensembleResolveCurrent(false),180);
        }else{
          const spelling=typoCandidate(input,personAnswers(clue.person),clue.person);
          if(!spelling||!offerSpellingFix(spelling)) feedback("Not quite. Try again, skip this clue, or reveal the actor.","wrong");
        }
      }else if(st.phase==="guess"){
        if(filmTitleMatches(input,d.film)||sameAnswer(input,d.aliases||[])){
          st.points=ensemblePoints(st);
          st.phase="done";
          st.done=true;
          st.feedback="";
          st.feedbackType="";
          completeCurrentRound(st.points,true);
          stage.scrollTop=0;
          renderRound();
          requestAnimationFrame(()=>{ stage.scrollTop=0; });
        }else{
          const spelling=filmTitleTypoCandidate(input,[d.film,...(d.aliases||[])]);
          if(!spelling||!offerSpellingFix(d.film)){
            st.feedback="Not quite. Add another cast member or try a different film.";st.feedbackType="wrong";feedback(st.feedback,"wrong");
          }
        }
      }return;
    }
    if(round.type==="title"){
      const d=round.data;
      if(sameAnswer(input,[d.word])){
        st.points=titlePoints(st);
        st.done=true;
        completeCurrentRound(st.points,true);
        stage.scrollTop=0;
        renderRound();
        requestAnimationFrame(()=>{ stage.scrollTop=0; });
      }
      else{
        const spelling=typoCandidate(input,[d.word],d.word);
        if(!spelling||!offerSpellingFix(spelling)) feedback(st.shownCount<d.links.length?"Not quite. Try again or reveal another actor.":"Not quite. Try again or reveal the word.","wrong");
      }
    }
  }
  function revealAnswer(){
    const round=session.rounds[session.index],st=session.current;
    if(round.type==="boxoffice"){giveUpBoxOffice();return;}
    if(round.type==="ensemble"){
      if(st.phase==="cast")revealCurrentEnsembleActor();
      else if(st.phase==="guess")giveUpEnsembleFilm();
      return;
    }
    if(round.type==="title"){giveUpTitleLink();return;}
  }
  function nextRound(){
    if(!session)return;
    if(session.style==="infinite"){session.index+=1;session.rounds.push(makeInfiniteRound(session.mode));loadRound();return;}
    session.index+=1;if(session.index>=session.rounds.length)finishSession();else loadRound();
  }
  function finishSession(){
    const completedMode=session.mode;
    progressTrack?.classList.remove("infinite");progressFill.style.width="100%";progressText.textContent="Done";modeName.textContent="Daily complete";roundKicker.textContent="FILMDEN";
    const max=session.rounds.reduce((sum,r)=>sum+roundMaxScore(r),0),pct=max?Math.round((session.score/max)*100):0;
    stage.innerHTML=`<div class="done"><div class="done-icon">★</div><h2>${pct}%</h2><p>Today's ${MODE_NAMES[completedMode]} is complete. You scored ${session.score} of ${max} available points.</p><div class="summary-grid"><div class="summary-card"><div class="summary-value">${session.score}</div><div class="summary-label">Points</div></div><div class="summary-card"><div class="summary-value">${session.solved}</div><div class="summary-label">Solved</div></div><div class="summary-card"><div class="summary-value">${session.revealed}</div><div class="summary-label">Reveals</div></div></div></div>`;
    primaryBtn.disabled=false;primaryBtn.textContent=`Keep playing ${MODE_NAMES[completedMode]} →`;secondaryBtn.textContent="Games";primaryBtn.onclick=()=>startInfinite(completedMode);secondaryBtn.classList.remove("hidden");secondaryBtn.disabled=false;secondaryBtn.onclick=openHome;
  }
  function ensureGamesButton(){
    if(!secondaryBtn)return;
    if((secondaryBtn.textContent||"").trim()==="Games"){
      // Only mutate when something actually needs changing. This function is
      // also called from a MutationObserver, so unconditional class/disabled
      // writes can create an observer feedback loop and prevent completion
      // screens from ever painting.
      if(secondaryBtn.classList.contains("hidden"))secondaryBtn.classList.remove("hidden");
      if(secondaryBtn.disabled)secondaryBtn.disabled=false;
      if(secondaryBtn.onclick!==openHome)secondaryBtn.onclick=openHome;
    }
  }
  function openHome(){
    renderHome();
    overlay.classList.remove("hidden");
    overlay.removeAttribute("aria-hidden");
    secondaryBtn.disabled=false;
  }
  const gamesButtonObserver=new MutationObserver(ensureGamesButton);
  // Text changes (for example switching the secondary action to “Games”) are
  // enough to trigger the safety check. Do not observe class/disabled here —
  // ensureGamesButton itself may legitimately change those attributes.
  gamesButtonObserver.observe(secondaryBtn,{childList:true,subtree:true});

  $("dailyGrid").addEventListener("click",e=>{const btn=e.target.closest("[data-daily-mode]");if(!btn)return;const mode=btn.dataset.dailyMode;dailyStatus(mode)?startInfinite(mode):startDaily(mode);});
  $("homeBtn").addEventListener("click",openHome);
  document.addEventListener("keydown",e=>{
    const active=document.activeElement;
    if(e.key==="Enter"&&overlay.classList.contains("hidden")&&(active===$("answerInput")||active===$("boxOfficeSearch"))){e.preventDefault();submitAnswer();}
  });

  renderHome();
  stage.innerHTML=`<div class="stage-label">WELCOME</div><h2 class="question">Movie knowledge, connected.</h2><div class="subcopy">Seven games. One new daily challenge in each.</div>`;
})();
</script>
